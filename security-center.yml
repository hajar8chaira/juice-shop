version: 1

scanners:
  semgrep: true
  gitleaks: true
  trivy: true
  osv: true
  sonarqube: false
  snyk: false
  zap: false

policy:
  fail_on: CRITICAL
  max_active: 999999
  include_tests: true

gate:
  fail_on_severity: [CRITICAL]
  warn_on_severity: [HIGH]
  block_secrets: true
  priority_threshold: 80
  warn_priority_threshold: 60
  require_sbom: true

supply_chain:
  require_provenance: true
  require_signature: false

execution:
  max_parallel_scanners: 2
